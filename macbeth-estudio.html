/* ---------- UTILIDADES ---------- */
const $ = s => document.querySelector(s);
const shuffle = a => { a = a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

/* ---------- TABS ---------- */
document.querySelectorAll('[data-tab]').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('[data-tab]').forEach(x => x.setAttribute('aria-selected', x === b ? 'true' : 'false'));
  ['quiz','cards','sum'].forEach(id => $('#'+id).classList.toggle('hidden', id !== b.dataset.tab));
}));

/* ---------- CUESTIONARIO ---------- */
const quiz = {cat:'all', mix:true, list:[], i:0, score:0, done:false, failed:[], answered:false, finished:false};

function buildQuestion(row){
  const [cat,q,right,w1,w2,w3,exp] = row;
  return {cat,q,right,exp,opts:shuffle([{t:right,ok:true},{t:w1},{t:w2},{t:w3}])};
}
function startQuiz(source){
  const pool = source || QS.filter(r => quiz.cat === 'all' || r[0] === quiz.cat);
  quiz.list = (quiz.mix ? shuffle(pool) : pool).map(buildQuestion);
  quiz.i = 0; quiz.score = 0; quiz.failed = []; quiz.answered = false; quiz.finished = false;
  renderQuiz();
}
function renderChips(){
  return '<div class="chips" role="group" aria-label="Filtrar por tema">' +
    Object.entries(CATS).map(([k,v]) => `<button class="chip" data-cat="${k}" aria-pressed="${quiz.cat===k}">${v}${k==='all'?` (${QS.length})`:` (${QS.filter(r=>r[0]===k).length})`}</button>`).join('') + '</div>';
}
function renderQuiz(){
  const el = $('#quiz');
  const head = renderChips() + `<div class="toolbar"><label><input type="checkbox" id="mix" ${quiz.mix?'checked':''}> Mezclar preguntas</label><button class="link" id="restart">Reiniciar</button></div>`;
  let body = '';
  if(quiz.finished){
    const n = quiz.list.length, pct = Math.round(100*quiz.score/n);
    body = `<div class="panel"><p class="meta">Resultado</p><div class="score">${quiz.score} / ${n}</div><p>${pct>=80?'Muy bien: ya dominas esta parte.':pct>=60?'Buen avance, repasa lo fallado.':'Vale la pena repasar y repetir.'}</p>
      ${quiz.failed.length?`<h3>Para repasar</h3><ul class="fails">${quiz.failed.map(f=>`<li>${esc(f.q)}<small>Correcta: ${esc(f.right)}</small></li>`).join('')}</ul>`:''}
      <div class="row">${quiz.failed.length?'<button class="btn" id="retry">Repetir las falladas</button>':''}<button class="btn alt" id="again">Empezar de nuevo</button></div></div>`;
  } else {
    const q = quiz.list[quiz.i], n = quiz.list.length;
    body = `<div class="panel"><div class="bar"><span style="width:${100*quiz.i/n}%"></span></div>
      <p class="meta">Pregunta ${quiz.i+1} de ${n} · ${CATS[q.cat]}</p>
      <h2 class="qtext">${esc(q.q)}</h2>
      <div class="opts">${q.opts.map((o,idx)=>`<button class="opt" data-i="${idx}">${esc(o.t)}</button>`).join('')}</div>
      <div id="reveal"></div>
      <div class="row"><button class="link" id="peek">Ver respuesta</button><button class="btn hidden" id="next">${quiz.i+1===n?'Ver resultado':'Siguiente'}</button></div></div>`;
  }
  el.innerHTML = head + body;

  el.querySelectorAll('[data-cat]').forEach(b => b.onclick = () => { quiz.cat = b.dataset.cat; startQuiz(); });
  $('#mix').onchange = e => { quiz.mix = e.target.checked; startQuiz(); };
  $('#restart').onclick = () => startQuiz();
  if(quiz.finished){
    $('#again').onclick = () => startQuiz();
    const r = $('#retry'); if(r) r.onclick = () => { const f = quiz.failed.map(x => QS.find(row => row[1] === x.q)); startQuiz(f); };
    return;
  }
  const q = quiz.list[quiz.i];
  const showAnswer = (chosen) => {
    if(quiz.answered) return;
    quiz.answered = true;
    const btns = el.querySelectorAll('.opt');
    btns.forEach((b,idx) => { b.disabled = true; if(q.opts[idx].ok) b.classList.add('ok'); else if(idx === chosen) b.classList.add('bad'); else b.classList.add('dim'); });
    if(chosen === undefined){ /* solo miró */ quiz.failed.push(q); }
    else if(q.opts[chosen].ok) quiz.score++;
    else quiz.failed.push(q);
    $('#reveal').innerHTML = `<div class="answer"><p class="key">Respuesta correcta: ${esc(q.right)}</p><p class="exp">${esc(q.exp)}</p></div>`;
    $('#peek').classList.add('hidden');
    $('#next').classList.remove('hidden');
    $('#next').focus();
  };
  el.querySelectorAll('.opt').forEach(b => b.onclick = () => showAnswer(+b.dataset.i));
  $('#peek').onclick = () => showAnswer(undefined);
  $('#next').onclick = () => { quiz.answered = false; if(quiz.i+1 >= quiz.list.length) quiz.finished = true; else quiz.i++; renderQuiz(); window.scrollTo({top:0}); };
}

/* ---------- TARJETAS ---------- */
const fc = {deck:'pj', list:[], i:0, flipped:false};
function loadDeck(k, mix){ fc.deck = k; let l = CARDS.filter(c => c[0] === k); fc.list = mix ? shuffle(l) : l; fc.i = 0; fc.flipped = false; renderCards(); }
function renderCards(){
  const el = $('#cards'), c = fc.list[fc.i];
  el.innerHTML = `<div class="chips" role="group" aria-label="Mazo">${Object.entries(DECKS).map(([k,v])=>`<button class="chip" data-deck="${k}" aria-pressed="${fc.deck===k}">${v}</button>`).join('')}</div>
   <div class="toolbar"><span>${fc.i+1} de ${fc.list.length}</span><button class="link" id="shuf">Mezclar</button></div>
   <button class="panel card ${fc.flipped?'flipped':''}" id="card" aria-live="polite">
     ${fc.flipped ? `<div class="back">${esc(c[2])}</div><div class="hint">Toca para volver</div>` : `<div class="front">${esc(c[1])}</div><div class="hint">Toca para ver la respuesta</div>`}
   </button>
   <div class="row"><button class="btn alt" id="prev">Anterior</button><button class="btn" id="nxt">Siguiente</button></div>`;
  el.querySelectorAll('[data-deck]').forEach(b => b.onclick = () => loadDeck(b.dataset.deck, false));
  $('#shuf').onclick = () => loadDeck(fc.deck, true);
  $('#card').onclick = () => { fc.flipped = !fc.flipped; renderCards(); };
  $('#prev').onclick = () => { fc.i = (fc.i - 1 + fc.list.length) % fc.list.length; fc.flipped = false; renderCards(); };
  $('#nxt').onclick = () => { fc.i = (fc.i + 1) % fc.list.length; fc.flipped = false; renderCards(); };
}

/* ---------- RESUMEN ---------- */
function renderSummary(){
  $('#sum').innerHTML = SUM.map((s,i) => `<details ${i===0?'open':''}><summary>${s[0]}</summary><div class="body"><ul>${s[1].map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div></details>`).join('');
}

startQuiz(); loadDeck('pj', false); renderSummary();
</script>
